services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaia
      POSTGRES_USER: gaia
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env — see .env.example}
      TZ: America/New_York
    # Deliberately no `ports:`. Postgres is reachable only on the compose
    # network, which is what deploy/README.md and spec 8.3 promise; an exposed
    # 5432 holding a brokerage's client book is how these get owned.
    #
    # The test suite does need it published on the host. That is a local-only
    # exception, opted into explicitly:
    #     docker compose -f docker-compose.yml -f deploy/compose.dev.yml up -d db
    # It lives in a file compose does NOT auto-load, so it cannot follow the
    # repo onto the droplet by accident (a `docker-compose.override.yml` would).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaia -d gaia"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/New_York
      # .env's DATABASE_URL is for a host process talking to the port that
      # deploy/compose.dev.yml publishes locally; service `environment:` beats
      # `env_file:`, so this is what the app container actually uses to reach
      # `db` over the compose network.
      DATABASE_URL: postgresql://gaia:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/gaia
    depends_on:
      db:
        condition: service_healthy

  jobs:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/New_York
      # .env's DATABASE_URL is for a host process talking to the port that
      # deploy/compose.dev.yml publishes locally; service `environment:` beats
      # `env_file:`, so this is what the jobs container actually uses to reach
      # `db` over the compose network.
      DATABASE_URL: postgresql://gaia:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/gaia
    command: ["python", "-m", "gaia.jobs.digest"]
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: America/New_York
    volumes:
      - ./deploy:/deploy:ro
    entrypoint: ["/bin/sh", "-c"]
    # Anchored to 03:00 America/New_York (TZ above), not "86400s after the
    # container started" — a restart at 3pm must not shift backups to 3pm,
    # and a container that never stays up 24h must not skip backups forever.
    # `now` is recomputed every iteration (after the previous backup.sh has
    # already finished), so a multi-minute backup cannot drift the schedule
    # or double-fire: whatever time it is when we loop back, we always sleep
    # to the next 03:00 from there. A failed backup.sh is logged and the
    # loop continues to the next night rather than dying.
    command: >
      "apk add --no-cache aws-cli >/dev/null &&
       while true; do
         now=$(date +%s);
         next=$(date -d '03:00' +%s);
         if [ $$next -le $$now ]; then next=$((next + 86400)); fi;
         sleep $((next - now));
         /deploy/backup.sh || echo 'backup failed';
       done"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      # DOMAIN only — without it {$DOMAIN} in the Caddyfile expands to nothing.
      # Deliberately not `env_file: .env`: that handed the public-facing TLS
      # terminator the Anthropic key, the WhatsApp token and the database
      # password, none of which it has any use for.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
