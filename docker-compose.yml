services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaia
      POSTGRES_USER: gaia
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      TZ: America/New_York
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaia -d gaia"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/New_York
      # .env's DATABASE_URL is for a host process talking to the published
      # port; service `environment:` beats `env_file:`, so this is what the
      # app container actually uses to reach `db` over the compose network.
      DATABASE_URL: postgresql://gaia:${DB_PASSWORD:-devpassword}@db:5432/gaia
    depends_on:
      db:
        condition: service_healthy

  jobs:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/New_York
      # .env's DATABASE_URL is for a host process talking to the published
      # port; service `environment:` beats `env_file:`, so this is what the
      # jobs container actually uses to reach `db` over the compose network.
      DATABASE_URL: postgresql://gaia:${DB_PASSWORD:-devpassword}@db:5432/gaia
    command: ["python", "-m", "gaia.jobs.digest"]
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      TZ: America/New_York
    volumes:
      - ./deploy:/deploy:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "apk add --no-cache aws-cli >/dev/null &&
       while true; do sleep 86400; /deploy/backup.sh || echo 'backup failed'; done"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env          # without this {$DOMAIN} expands to nothing
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
