[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "voyageai>=0.3",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pillow>=11.0",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    # Real Anthropic and Voyage calls against a real database. Billable, slower
    # and subject to model variation, so they are deselected by default: plain
    # `pytest` runs exactly the 181 hermetic tests it ran before this tier
    # existed. Run them with `pytest -m live` — the second -m wins over the one
    # in addopts below.
    "live: hits real external services. Deselected by default; run with `-m live`.",
]
addopts = ["-m", "not live"]
filterwarnings = [
    # Upstream-only: starlette.testclient's own import triggers this on the
    # anyio version we use. Nothing in our code touches BlockingPortal.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.setuptools.packages.find]
include = ["gaia*"]
